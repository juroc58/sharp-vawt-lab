name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast suite: tests + lint + freshness + README sync + figure smoke.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Run fast test suite
        run: |
          python -m pytest tests/ -q -m "not slow"

      - name: Polar sanity report (warnings, not a gate)
        run: |
          python scripts/check_polars.py --fail-on-warnings

      - name: Freshness check (result JSON stamps)
        run: |
          python scripts/check_freshness.py

      - name: Validate README in sync with generated JSON
        run: |
          python scripts/build_readme.py --check

      - name: Figure check (lightweight smoke)
        run: |
          python scripts/check_figures.py

  # Pure-Python job: numba disabled, verifies the engine runs without JIT.
  no-jit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run fast test suite with NUMBA_DISABLE_JIT=1
        run: |
          NUMBA_DISABLE_JIT=1 python -m pytest tests/ -q -m "not slow and not needs_jit"

      - name: Verify needs_jit tests are still excluded
        run: |
          # Lists tests that carry the needs_jit marker and would be run by the
          # fast suite if the marker were accidentally removed.  Fails if the
          # count drops to zero (marker lost on all needs_jit tests).
          N=$(NUMBA_DISABLE_JIT=1 python -m pytest tests/ --collect-only -m needs_jit -q 2>&1 \
              | grep -oE '[0-9]+ selected' | head -1 | grep -oE '[0-9]+' || true)
          N=${N:-0}
          if [ "$N" -eq 0 ]; then
            echo "::error::No needs_jit-marked tests found; the no-JIT job may run them unintentionally"
            exit 1
          fi
          echo "$N needs_jit-marked test(s) correctly excluded from the no-JIT run"

  # Slow validation job: Ham comparison and full validation suite.
  # Marked slow so it can be run less frequently if needed.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ham 1979 comparison (2D upper bound, not validation)
        run: |
          python scripts/validate_ham.py

      - name: Run all validations
        run: |
          python scripts/validate_all.py
