name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Cache numba
        uses: actions/cache@v4
        with:
          path: ~/.cache/numba
          key: numba-${{ matrix.python-version }}-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            numba-${{ matrix.python-version }}-${{ runner.os }}-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run fast tests (with coverage)
        run: pytest -m "not slow" --cov --cov-report=term-missing
        continue-on-error: ${{ matrix.python-version == '3.14' }}

      - name: Run validation suite
        run: python3 scripts/validate_all.py
        continue-on-error: ${{ matrix.python-version == '3.14' }}

      - name: Run slow validation tests
        run: pytest -m "slow"
        timeout-minutes: 20
        continue-on-error: ${{ matrix.python-version == '3.14' }}