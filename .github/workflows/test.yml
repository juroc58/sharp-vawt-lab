name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is tested but non-blocking: numba wheel availability at the
        # newest CPython release can lag. 3.11-3.13 are blocking.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run fast tests (with coverage)
        run: pytest -m "not slow" --cov --cov-report=term-missing
        continue-on-error: ${{ matrix.python-version == '3.14' }}

      - name: Run slow validation tests
        run: pytest -m "slow"
        timeout-minutes: 15
        continue-on-error: ${{ matrix.python-version == '3.14' }}