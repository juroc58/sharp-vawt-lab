[tool.setuptools]
packages = ["sharp_vawt"]
package-dir = { "sharp_vawt" = "sharp_vawt" }

[tool.setuptools.package-data]
sharp_vawt = [
    "airfoil_polars/naca0012/*.csv",
    "airfoil_polars/provenance.json",
    "airfoil_polars/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests that take more than 30 seconds (skip with -m \"not slow\")",
    "needs_jit: tests that require numba JIT compilation (timeout without it)",
]

[tool.coverage.run]
source = ["sharp_vawt", "scripts"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]