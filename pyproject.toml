[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-vawt-lab"
version = "3.5.0"
description = "2D BEM solver for the Sharp cycloturbine (passive variable-pitch VAWT with centrifugal-pendulum pitch control)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "juroc58" }]
keywords = [
    "vawt", "wind-energy", "bem", "cycloturbine", "dynamic-stall",
    "vertical-axis-wind-turbine", "numba",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/juroc58/sharp-vawt-lab"
Repository = "https://github.com/juroc58/sharp-vawt-lab"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

# Legacy scripts not refactored in this repair round retain pre-existing lint
# debt (BLE001 blind-except, EXE001/EXE002 shebang bits, PLW1510 subprocess,
# F821 undefined-name, SIM115 open-without-context, etc.). They are covered by
# tests and freshness checks; lint debt is tracked as a follow-up. New files
# added in this round (sharp_vawt/*, vawt_core.py, scripts/stamp.py,
# scripts/check_freshness.py, scripts/uncertainty.py, scripts/build_readme.py,
# scripts/import_prototype_data.py, scripts/compare_prototype.py,
# scripts/calibrate_dynamic_stall.py, scripts/make_all_figures.py,
# scripts/check_figures.py, scripts/plot_uncertainty.py,
# scripts/plot_spearman.py, tests/test_*.py new in this round) are ruff-clean.
